list_users:
  fields:
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

approve_user:
  fields:
    username:
      required: true
      example: family-phone
      selector:
        text:
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

set_user_permission:
  fields:
    username:
      required: true
      example: family-phone
      selector:
        text:
    permission:
      required: true
      example: user
      selector:
        select:
          options:
            - admin
            - user
            - disable
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

delete_user:
  fields:
    username:
      required: true
      example: family-phone
      selector:
        text:
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

list_transmitters:
  fields:
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

delete_transmitter:
  fields:
    serial:
      required: true
      example: "0x1A2B3C"
      selector:
        text:
    button:
      required: false
      example: 4
      selector:
        number:
          min: 0
          max: 15
          mode: box
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

add_transmitter:
  fields:
    serial:
      required: true
      example: "0x1A2B3C"
      selector:
        text:
    button:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 15
          mode: box
    command:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 15
          mode: box
    type:
      required: false
      example: mono
      selector:
        select:
          options:
            - mono
            - bidi
    round:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    priority:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    group_abilitation:
      required: false
      example: 12
      selector:
        number:
          min: 0
          max: 15
          mode: box
    t4_group:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 15
          mode: box
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

set_transmitter_command:
  fields:
    serial:
      required: true
      example: "0x1A2B3C"
      selector:
        text:
    button:
      required: true
      example: 4
      selector:
        number:
          min: 1
          max: 15
          mode: box
    command:
      required: true
      example: 4
      selector:
        number:
          min: 1
          max: 15
          mode: box
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

learn_transmitter:
  fields:
    timeout:
      required: false
      example: 60
      selector:
        number:
          min: 5
          max: 180
          unit_of_measurement: seconds
          mode: box
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi
