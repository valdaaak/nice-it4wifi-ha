list_users:
  fields:
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

approve_user:
  fields:
    username:
      required: true
      example: family-phone
      selector:
        text:
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

set_user_permission:
  fields:
    username:
      required: true
      example: family-phone
      selector:
        text:
    permission:
      required: true
      example: user
      selector:
        select:
          options:
            - admin
            - user
            - disable
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi

delete_user:
  fields:
    username:
      required: true
      example: family-phone
      selector:
        text:
    config_entry_id:
      required: false
      example: 0123456789ABCDEFGHJKMNPQRS
      selector:
        config_entry:
          integration: nice_it4wifi
